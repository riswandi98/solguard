[package]
name = "solguard-checklog"
version = "0.1.0"
edition = "2021"
description = "SolGuard on-chain check log: records that a transaction signature was risk-checked, with its risk level. Log-only attestation program (devnet for the Dev3pack hackathon build)."

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
solana-program = "2.2"

[profile.release]
overflow-checks = true
